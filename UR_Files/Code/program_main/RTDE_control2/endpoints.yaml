# =========================
# PolyScope X 10.12 — Robot API endpoints
# =========================

# -------- Program lifecycle --------
# Load a program by name
load_program:
  method: PUT
  path: /universal-robots/robot-api/program/v1/load
  # CLI: cmd load_program programName=demo_program
  args: ["programName"]

# Control execution state of the loaded program (all via /program/v1/state)
play:
  method: PUT
  path: /universal-robots/robot-api/program/v1/state
  fixedBody: { action: play }

pause:
  method: PUT
  path: /universal-robots/robot-api/program/v1/state
  fixedBody: { action: pause }

resume:
  method: PUT
  path: /universal-robots/robot-api/program/v1/state
  fixedBody: { action: resume }

stop:
  method: PUT
  path: /universal-robots/robot-api/program/v1/state
  fixedBody: { action: stop }

# Read current program state (STOPPED | PLAYING | PAUSED)
get_program_state:
  method: GET
  path: /universal-robots/robot-api/program/v1/state



# -------- System time --------
# Read system time
get_system_time:
  method: GET
  path: /universal-robots/robot-api/system/v1/system-time/

# Set system time (expects ISO-8601 string, e.g., 2026-02-20T16:30:00Z)
set_system_time:
  method: PUT
  path: /universal-robots/robot-api/system/v1/system-time/
  args: ["time"]

# Optional: if you added the Python helper to send "now" automatically
set_system_time_now:
  method: PUT
  path: /universal-robots/robot-api/system/v1/system-time/


# -------- Robot state control (power & safety) --------
# All actions are issued to PUT /robotstate/v1/state/ with a JSON body: {"action":"<ENUM>"}
power_on:
  method: PUT
  path: /universal-robots/robot-api/robotstate/v1/state/
  fixedBody: { action: "POWER_ON" }

power_off:
  method: PUT
  path: /universal-robots/robot-api/robotstate/v1/state/
  fixedBody: { action: "POWER_OFF" }

brake_release:
  method: PUT
  path: /universal-robots/robot-api/robotstate/v1/state/
  fixedBody: { action: "BRAKE_RELEASE" }

unlock_protective_stop:
  method: PUT
  path: /universal-robots/robot-api/robotstate/v1/state/
  fixedBody: { action: "UNLOCK_PROTECTIVE_STOP" }

restart_safety:
  method: PUT
  path: /universal-robots/robot-api/robotstate/v1/state/
  fixedBody: { action: "RESTART_SAFETY" }